<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Player</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>body{margin:0;padding:0;background:transparent;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Inter',sans-serif,*sans-serif;}.omp{--omp-accent:#9b6b8a;--omp-bg:#1a1a1a;--omp-title:#e0d0d8;--omp-artist:#9b6b8a;--omp-track:#333;--omp-time:#777;width:300px;padding:14px 16px;background:var(--omp-bg);border-radius:8px;}.omp-info{margin-bottom:10px;}.omp-title{font-size:13px;font-weight:600;color:var(--omp-title);}.omp-artist{font-size:11px;color:var(--omp-artist);margin-top:2px;}.omp-controls{display:flex;align-items:center;gap:10px;}.omp-btn{background:none;border:none;color:var(--omp-accent);font-size:14px;cursor:pointer;padding:0;width:20px;text-align:center;}.omp-track{flex:1;height:4px;background:var(--omp-track);border-radius:2px;position:relative;cursor:pointer;overflow:hidden;}.omp-fill{height:100%;width:0%;background:var(--omp-accent);border-radius:2px;transition:width .1s linear;}.omp-time{font-size:9px;color:var(--omp-time);white-space:nowrap;}</style></head><body><div class="omp"><div class="omp-info"><div class="omp-title">Título de la Canción</div><div class="omp-artist">Nombre del Artista</div></div><div class="omp-controls"><button class="omp-btn" onclick="ompToggle()"><i class="fas fa-play" id="omp-icon"></i></button><div class="omp-track" onclick="ompSeek(event)"><div class="omp-fill" id="omp-fill"></div></div><div class="omp-time"><span id="omp-cur">0:00</span>/<span id="omp-dur">0:00</span></div></div><audio id="omp-aud" preload="metadata" src="URL_MP3_AQUI"></audio></div><script>function ompToggle(){var a=document.getElementById('omp-aud'),i=document.getElementById('omp-icon');if(a.paused){a.play();i.className='fas fa-pause';}else{a.pause();i.className='fas fa-play';}}function ompSeek(e){var a=document.getElementById('omp-aud'),r=e.currentTarget.getBoundingClientRect();a.currentTime=((e.clientX-r.left)/r.width)*a.duration;}setInterval(function(){var a=document.getElementById('omp-aud'),f=document.getElementById('omp-fill'),c=document.getElementById('omp-cur'),d=document.getElementById('omp-dur');if(a.duration){f.style.width=(a.currentTime/a.duration*100)+'%';c.textContent=Math.floor(a.currentTime/60)+':'+('0'+Math.floor(a.currentTime%60)).slice(-2);d.textContent=Math.floor(a.duration/60)+':'+('0'+Math.floor(a.duration%60)).slice(-2);}},500);</script></body></html>
