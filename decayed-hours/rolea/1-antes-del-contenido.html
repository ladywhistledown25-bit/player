<!-- DECAYED HOURS · Pegar en: «Antes del contenido»
     Cabecera con el logo y el botón de modo claro/oscuro, en todas las páginas.
     Imagen de cabecera: añade style="--dh-header-img:url('https://tu-imagen.jpg')" a <header>. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<div class="dh">
  <header class="dh-header">
    <button class="dh-theme-toggle" type="button">
      <span class="dh-when-dark"><i class="fa-solid fa-sun"></i>Modo claro</span>
      <span class="dh-when-light"><i class="fa-solid fa-moon"></i>Modo oscuro</span>
    </button>
    <div class="dh-header__inner">
      <svg class="dh-mask" viewBox="0 0 64 72" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M32 3C15 3 7 15 7 32c0 20 11 36 25 37 14-1 25-17 25-37C57 15 49 3 32 3z" stroke-width="2"/>
        <path class="dh-mask__eyes" d="M16 23l10 10M26 23L16 33M38 23l10 10M48 23L38 33"/>
        <path d="M17 50c6 4 24 4 30 0"/>
        <path d="M22 47v7M28 48.5v7.5M34 48.5v7.5M40 47v7" stroke-width="1.6"/>
      </svg>
      <h1 class="dh-logo">Decayed Hours</h1>
      <p class="dh-tagline">Doce horas · Un parque · Ninguna regla</p>
    </div>
  </header>
</div>
