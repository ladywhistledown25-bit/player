<!-- DECAYED HOURS · Pegar en: «Antes del contenido»
     Cabecera con el logo y el botón de modo claro/oscuro, en todas las páginas.
     Imagen de cabecera: añade style="--dh-header-img:url('https://tu-imagen.jpg')" a <header>. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<div class="dh">
  <header class="dh-header">
    <button class="dh-theme-toggle" type="button">
      <span class="dh-when-dark"><i class="fa-solid fa-sun"></i>Modo claro</span>
      <span class="dh-when-light"><i class="fa-solid fa-moon"></i>Modo oscuro</span>
    </button>
    <div class="dh-header__inner">
      <h1 class="dh-logo">Decayed Hours</h1>
      <p class="dh-tagline">Doce horas · Un parque · Ninguna regla</p>
    </div>
  </header>
</div>
